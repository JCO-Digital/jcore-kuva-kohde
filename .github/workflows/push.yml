name: Release version

on:
  push:
    branches:
      - main
      - "push-action/**"

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      is_bumped: ${{ steps.foonver.outputs.is_bumped }}
      version: ${{ steps.foonver.outputs.version }}
      release_notes: ${{ steps.foonver.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ./blocks/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Build project
        run: make ci

      - name: Commit built blocks
        uses: EndBug/add-and-commit@v9
        with:
          add: "scripts/build"
          message: "chore(build): build scripts for release [skip ci]"
          default_author: github_actions
          push: false

      - name: Run foonver
        id: foonver
        uses: foonly/foonver@v0.13.0
        with:
          command: "auto"
          changelog: "true"
          push: "true"
          commit_suffix: "[skip ci]"
          version_sync: "jcore-kuva-kohde.php"

  # Call the reusable workflow from jcore-update
  publish:
    needs: release
    if: needs.release.outputs.is_bumped == 'true'
    uses: JCO-Digital/jcore-update/.github/workflows/reusable-plugin-publish.yml@main
    with:
      build: false
      slug: "jcore-kuva-kohde"
      version: ${{ needs.release.outputs.version }}
      release_notes: ${{ needs.release.outputs.release_notes }}
      plugin_file: "jcore-kuva-kohde.php"
    secrets:
      UPDATE_API_KEY: ${{ secrets.UPDATE_API_KEY }}
